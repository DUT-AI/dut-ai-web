<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập Admin V2</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-6">
      Đăng nhập Admin
    </h1>

    {% if error %}
      <div class="mb-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 px-4 py-3 text-sm">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-2">Tài khoản</label>
        <input
          type="text"
          name="username"
          required
          class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
          placeholder="Nhập tài khoản admin"
        >
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-600 mb-2">Mật khẩu</label>
        <input
          type="password"
          name="password"
          required
          class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
          placeholder="Nhập mật khẩu"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl"
      >
        Đăng nhập
      </button>
    </form>
  </div>
</body>
</html>
