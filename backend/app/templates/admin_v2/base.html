<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản trị hệ thống{% endblock %} - DUT-AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .sidebar-item-active { background: linear-gradient(to right, #4f46e5, #818cf8); color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-screen sticky top-0 z-50">
        <div class="p-8 pb-4 flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-robot text-xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-xl tracking-tight text-slate-800">DUT-AI</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Admin Dashboard</p>
            </div>
        </div>

        <nav class="flex-1 px-4 mt-8 space-y-1.5 overflow-y-auto hide-scrollbar">
            <p class="px-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">Chính</p>
            
            <a href="/admin_v2" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'dashboard' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-chart-line w-5 text-center"></i>
                <span class="font-semibold text-sm">Dashboard</span>
            </a>

            <p class="px-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-6 mb-2">Nội dung</p>
            
            <a href="/admin_v2/blogs" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'blogs' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-file-pen w-5 text-center"></i>
                <span class="font-semibold text-sm">Quản lý Blogs</span>
            </a>

            <a href="/admin_v2/projects" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'projects' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-laptop-code w-5 text-center"></i>
                <span class="font-semibold text-sm">Dự án</span>
            </a>

            <a href="/admin_v2/events" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'events' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-calendar-check w-5 text-center"></i>
                <span class="font-semibold text-sm">Sự kiện</span>
            </a>

            <a href="/admin_v2/posts" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'posts' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-newspaper w-5 text-center"></i>
                <span class="font-semibold text-sm">Posts</span>
            </a>

            <p class="px-4 text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-6 mb-2">Hệ thống</p>

            <a href="/admin_v2/users" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'users' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-users w-5 text-center"></i>
                <span class="font-semibold text-sm">Người dùng</span>
            </a>

            <a href="/admin_v2/keywords" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all hover:bg-slate-50 group sidebar-item {% if active_page == 'keywords' %}sidebar-item-active{% endif %}">
                <i class="fa-solid fa-tags w-5 text-center"></i>
                <span class="font-semibold text-sm">Từ khóa</span>
            </a>
        </nav>

        <div class="p-6 border-t border-slate-100">
            <a href="/admin/logout" class="flex items-center gap-3 px-4 py-3 rounded-xl text-rose-500 hover:bg-rose-50 transition-all font-bold text-sm">
                <i class="fa-solid fa-right-from-bracket w-5"></i>
                Đăng xuất
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <!-- Top Header -->
        <header class="h-20 glass border-b border-slate-200/50 sticky top-0 z-40 px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h2 class="text-lg font-bold text-slate-800">{% block page_title %}Tổng quan{% endblock %}</h2>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="relative hidden sm:block">
                    <input type="text" placeholder="Tìm kiếm..." class="bg-slate-100/50 border-none rounded-full px-5 py-2 text-sm w-64 focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                </div>
                
                <div class="flex items-center gap-3 border-l pl-6 border-slate-200">
                    <div class="text-right">
                        <p class="text-sm font-bold text-slate-800 leading-none">Admin</p>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">Quản trị viên</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=4f46e5&color=fff" alt="Avatar">
                    </div>
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <div class="flex-1 overflow-y-auto p-8 hide-scrollbar">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
