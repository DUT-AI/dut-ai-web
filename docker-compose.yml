services:
  db:
    image: postgres:16-alpine
    container_name: dut-ai-web-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wagtail}
      POSTGRES_USER: ${POSTGRES_USER:-wagtail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagtail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wagtail} -d ${POSTGRES_DB:-wagtail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
      target: production
    container_name: dut-ai-web-backend
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagtail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagtail}
      POSTGRES_DB: ${POSTGRES_DB:-wagtail}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${BACKEND_PORT:-8002}:8002"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: dut-ai-web-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
